[project]
name = "cog"
version = "0.1.0"
description = "Centre of Gravity — depot location optimiser for parcel demand points"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "jinja2>=3.1.6",
    "numpy>=2.4.4",
    "ortools>=9.15.6755",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
webview = ["pywebview>=5.0"]

[project.scripts]
cog = "cog.app:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cog"]
